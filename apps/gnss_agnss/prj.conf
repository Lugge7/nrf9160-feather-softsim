# General
CONFIG_FPU=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# GNSS sample
# nRF Cloud
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_COAP=y

# CoAP Client
CONFIG_COAP_CLIENT_BLOCK_SIZE=1024
CONFIG_COAP_CLIENT_STACK_SIZE=6144
CONFIG_COAP_CLIENT_THREAD_PRIORITY=0

# LTE Link Control
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
# PSM requested periodic TAU 8 hours
CONFIG_LTE_PSM_REQ_RPTAU="00101000"
# PSM requested active time 6 seconds
CONFIG_LTE_PSM_REQ_RAT="00000011"

# AT Host library - Used to send AT commands directy from an UART terminal and to allow
#		    integration with nRF Connect for Desktop LTE Link monitor application.
CONFIG_AT_HOST_LIBRARY=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS=y
# Disable native network stack to save some memory
CONFIG_NET_NATIVE=n

# Memory and stack configuration
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536

# ---------------------------------------------------------------------------
# Feather / SoftSIM deltas. Everything above is the upstream sample's prj.conf,
# minus CONFIG_TFM_PROFILE_TYPE_MINIMAL and the A-GNSS=n default.
# ---------------------------------------------------------------------------

# TF-M profile
#
# Upstream sets CONFIG_TFM_PROFILE_TYPE_MINIMAL=y. That profile omits AES-CBC, so
# SoftSIM's psa_cipher_encrypt_setup(PSA_ALG_CBC_NO_PADDING) returns -134 and the SIM
# never authenticates. The module's overlay-softsim.conf selects
# CONFIG_TFM_PROFILE_TYPE_NOT_SET=y from the same choice; the line is removed rather
# than overridden because flipping a choice from a later fragment is fragile.

# TF-M Protected Storage must be off. With PS on, Partition Manager places a tfm_ps
# partition at 0xf0000 -- exactly where the SoftSIM filesystem lives -- pushing
# nvs_storage down to 0xe8000, so the app mounts an empty NVS and reports
# "Failed to init FS". Same setting as the other SoftSIM apps here.
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=n

# A-GNSS from nRF Cloud over CoAP. This is the whole point of the app: it replaces the
# SUPL client library, which is a separate licensed download that is not installed here.
# Selects NRF_CLOUD_COAP, which works on this nRF9160 because the device is onboarded by
# preconnect onboarding (see README) and the modem is mfw 1.3.7 (>= 1.3.5 required).
CONFIG_GNSS_SAMPLE_ASSISTANCE_NRF_CLOUD=y

# The GNSS LNA is gated by the modem's COEX0 pin on this board. Without this the GPS
# antenna is electrically disconnected and no fix is ever possible -- no error, no log
# line, the receiver simply never sees a satellite. Neither NCS nor the Asset Tracker
# Template knows about it; the string comes from Circuit Dojo's own gps sample.
# The \% escape resolves to % in the generated .config -- worth checking, because a
# mangled AT string fails silently. 1565-1586 MHz is the GPS band.
CONFIG_MODEM_ANTENNA=y
CONFIG_MODEM_ANTENNA_AT_COEX0="AT\%XCOEX0=1,1,1565,1586"

# System mode must include GPS. CONFIG_LTE_NETWORK_MODE_LTE_M excludes GNSS entirely and
# is a second, independent cause of "no fix" that looks identical to a dead antenna.
# src/main.c:72 BUILD_ASSERTs on this, so a wrong mode fails at compile time.
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=y

# nRF Cloud credentials and identity. Sec tag 16842753 already holds the CoAP root CA,
# device certificate and private key; the device is onboarded as nrf-<IMEI>. This ID must
# match the certificate CN exactly or nrf_cloud_coap_connect() fails to authenticate.
CONFIG_MODEM_KEY_MGMT=y
CONFIG_NRF_CLOUD_SEC_TAG=16842753
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_IMEI=y
CONFIG_NRF_CLOUD_CLIENT_ID_PREFIX="nrf-"

# Logging mode
#
# The upstream sample sets CONFIG_LOG_MODE_IMMEDIATE=y. On this board that produces
# ~20 characters of line noise per boot instead of console output -- the app runs fine
# (PC sits in the app region) but nothing legible comes out, which looks exactly like a
# baud mismatch or dead board. It is the only config that differs from the three SoftSIM
# apps here that log correctly, all of which use deferred mode.
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_MODE_DEFERRED=y

# Log level for this sample's own module.
#
# The SoftSIM overlay pins CONFIG_LOG_DEFAULT_LEVEL=1 (errors only) to keep the console
# quiet, and src/main.c registers its module as LOG_MODULE_REGISTER(gnss_sample,
# CONFIG_GNSS_SAMPLE_LOG_LEVEL), which follows that default. Every LOG_INF from main.c
# and assistance.c -- including the whole A-GNSS request/inject sequence this app exists
# to observe -- is then filtered out, leaving a boot banner and nothing else. The PVT
# satellite/position output uses printf and is unaffected, which makes the gap look like
# the assistance code is never running.
CONFIG_GNSS_SAMPLE_LOG_LEVEL_INF=y
