# Partition Manager is deprecated and no longer enabled by default from NCS 3.4, and this
# sample's Kconfig.sysbuild additionally sets `config PARTITION_MANAGER default n`. SoftSIM
# needs PM, so opt in here -- an explicit assignment overrides that default, which is why
# the sample's Kconfig.sysbuild is deliberately not copied. Without PM the /ns build signs
# with `--rom-fixed 0x50000` while MCUboot boots slot0 at 0x10000, and the image is rejected
# into fih_panic_loop with no console output at all.
SB_CONFIG_PARTITION_MANAGER=y

# SB_CONFIG_SOFTSIM_BUNDLE_TEMPLATE_HEX stays OFF: with it on, merged.hex carries a *blank*
# SIM template at 0xF0000 and any SWD flash of it wipes the live provisioning.

# The Feather has no onboard debugger, so MCUboot is built in and later updates can go over
# serial DFU. Must be the SB_CONFIG_ form.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
