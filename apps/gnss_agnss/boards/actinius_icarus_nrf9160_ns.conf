# Icarus v2 GNSS antenna.
#
# Board-specific because the two boards gate the GPS antenna in completely
# different ways, and getting it wrong is silent in both directions -- no error,
# no log line, the receiver simply never sees a satellite.
#
#   Feather  an onboard antenna whose LNA is gated by the modem's COEX0 pin, so
#            prj.conf sets CONFIG_MODEM_ANTENNA_AT_COEX0="AT\%XCOEX0=1,1,1565,1586".
#   Icarus   an *external* active patch antenna on the u.FL connector, supplied
#            through MAGPIO0. It needs AT%XMAGPIO instead, and no COEX0 gating.
#
# This file is merged after prj.conf, so these three override the Feather values.
# The %XMAGPIO string is the one Actinius document for the Icarus, and is also
# what NCS ships as the nRF9160 DK default -- same arrangement, same numbers.
# 1574-1577 MHz is the GPS L1 band the supply is switched on for.
#
# The \% escape resolves to % in the generated .config. Worth checking there
# after a build, because a mangled AT string fails silently.
CONFIG_MODEM_ANTENNA=y
CONFIG_MODEM_ANTENNA_GNSS_EXTERNAL=y
CONFIG_MODEM_ANTENNA_AT_MAGPIO="AT\%XMAGPIO=1,0,0,1,1,1574,1577"

# Bare form = COEX0 gating disabled. prj.conf assigns the Feather's gating string
# explicitly, so leaving this unset would carry it over to a board that has no
# such pin.
CONFIG_MODEM_ANTENNA_AT_COEX0="AT\%XCOEX0"
