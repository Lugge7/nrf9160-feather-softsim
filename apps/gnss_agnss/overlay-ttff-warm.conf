#
# Warm-start TTFF: what a tracker actually pays when it wakes from PSM.
#
#   west build -b circuitdojo_feather/nrf9160/ns -d build-agnss-warm apps\gnss_agnss `
#     -- "-DEXTRA_ZEPHYR_MODULES=.../modules/onomondo-softsim" `
#        "-DOVERLAY_CONFIG=.../apps/gnss_agnss/overlay-ttff-warm.conf"
#
# Same as overlay-ttff.conf except COLD_START is off. That single symbol is the whole
# experiment: with it on, the modem's ephemerides, almanac, iono data, last good fix and
# GPS time are deleted before every run, so each run re-fetches ~5 KB of A-GNSS and
# measures the assisted-cold path (13-18 s here). With it off, run 1 is assisted-cold and
# every run after reuses what the modem already holds -- no fetch, no cellular round trip.
#
# So run 1 is the control and runs 2+ are the measurement. Expect the gap between them to
# be large; that gap is the reason A-GNSS is only needed occasionally rather than per fix.

CONFIG_GNSS_SAMPLE_MODE_TTFF_TEST=y
CONFIG_GNSS_SAMPLE_MODE_TTFF_TEST_COLD_START=n

# Shorter than the cold overlay's 120 s. Nothing is being re-downloaded between runs, so
# the interval is no longer a data-cost knob -- it just sets how many samples per minute
# outdoors. Broadcast ephemeris stays usable for roughly 2 h, so a 60 s gap is well inside
# the valid window and every run after the first should be warm.
CONFIG_GNSS_SAMPLE_MODE_TTFF_TEST_INTERVAL=60
