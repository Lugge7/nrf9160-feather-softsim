#
# Report fixes to nRF Cloud so the device shows up on the Locations map.
#
# A-GNSS is a download only: assistance comes down, the fix is computed on the device
# and never leaves it. This overlay adds the uplink half.
#
#   west build -b circuitdojo_feather/nrf9160/ns -d build-agnss apps\gnss_agnss `
#     -- "-DEXTRA_ZEPHYR_MODULES=.../modules/onomondo-softsim" `
#        "-DOVERLAY_CONFIG=.../apps/gnss_agnss/overlay-uplink.conf"
#
# The app's CMakeLists appends the module overlay and overlay-mcuboot.conf after this
# one; neither touches the symbols below, so the ordering is safe.
#
# Not compatible with overlay-ttff.conf -- GNSS_SAMPLE_LOCATION_UPLINK depends on
# !GNSS_SAMPLE_MODE_TTFF_TEST, so a TTFF measurement run can never pay the uplink cost.

CONFIG_GNSS_SAMPLE_LOCATION_UPLINK=y

# Continuous mode emits a PVT every second. 60 s between uplinks is roughly 60 messages
# an hour of a few hundred bytes each -- call it 50 KB/h on the PAYG SIM. Raise it for
# a long unattended run.
CONFIG_GNSS_SAMPLE_LOCATION_UPLINK_INTERVAL=60

# The uplink needs a wall-clock timestamp or nRF Cloud drops the position. DATE_TIME is
# already selected by GNSS_SAMPLE_ASSISTANCE_NRF_CLOUD; this just makes the dependency
# explicit at the point of use.
CONFIG_DATE_TIME=y
