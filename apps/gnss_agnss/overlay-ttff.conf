#
# TTFF test mode: cold start, A-GNSS from nRF Cloud, repeat.
#
# Build into its own directory so build-agnss keeps the continuous-tracking image:
#   west build -b circuitdojo_feather/nrf9160/ns -d build-agnss-ttff apps\gnss_agnss `
#     -- "-DEXTRA_ZEPHYR_MODULES=.../modules/onomondo-softsim" `
#        "-DOVERLAY_CONFIG=.../apps/gnss_agnss/overlay-ttff.conf"
#
# The app's CMakeLists appends the module overlay and overlay-mcuboot.conf after this
# one; neither touches the symbols below, so the ordering is safe.

# Delete ephemerides, almanacs, iono data, last good fix and GPS time before every run.
# Without it the modem reuses ephemeris across resets and the measured TTFF flatters
# itself -- the 4 min 41 s unassisted baseline was a genuinely cold start.
CONFIG_GNSS_SAMPLE_MODE_TTFF_TEST=y
CONFIG_GNSS_SAMPLE_MODE_TTFF_TEST_COLD_START=y

# Seconds of idle between runs. Each run re-fetches the full A-GNSS set (~5 KB) over
# CoAP, so this is the knob that sets the data cost on the PAYG SIM: roughly one fetch
# per (fix time + this).
CONFIG_GNSS_SAMPLE_MODE_TTFF_TEST_INTERVAL=120
