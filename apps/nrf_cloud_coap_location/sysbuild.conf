# Partition Manager is deprecated and no longer enabled by default from NCS 3.4, and the
# upstream sample's Kconfig.sysbuild explicitly sets `config PARTITION_MANAGER default n`
# because it uses the DTS-partition path instead. SoftSIM needs PM (pm_static.yml layouts,
# NVS placement, and the template.hex address in the module's sysbuild hook), so opt in
# here. The sample's Kconfig.sysbuild is deliberately not copied -- without PM the /ns build
# signs with `--rom-fixed 0x50000` while MCUboot boots slot0 at 0x10000, and the image is
# rejected into fih_panic_loop with no console output at all.
SB_CONFIG_PARTITION_MANAGER=y

# SB_CONFIG_SOFTSIM_BUNDLE_TEMPLATE_HEX is deliberately left OFF, as in apps/throughput and
# apps/nrf_cloud_location. With it on, merged.hex carries a *blank* SIM template at 0xF0000
# and any SWD flash of it wipes the live provisioning. This app never provisions; it assumes
# a SoftSIM that is already up.

# The Feather has no onboard debugger, so MCUboot is built in and every app update goes
# over serial DFU with flash.ps1. Must be the SB_CONFIG_ form: the NCS 2.x
# CONFIG_BOOTLOADER_MCUBOOT is silently ignored under sysbuild.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
