# TF-M config
#
# The upstream sample sets CONFIG_TFM_PROFILE_TYPE_MINIMAL=y here. That profile omits
# AES-CBC, so SoftSIM's psa_cipher_encrypt_setup(PSA_ALG_CBC_NO_PADDING) returns -134 and
# the SIM never authenticates. The module's overlay-softsim.conf selects
# CONFIG_TFM_PROFILE_TYPE_NOT_SET=y from the same Kconfig choice, but a later fragment
# flipping a choice is fragile -- so the line is removed rather than overridden.
# Same reasoning as apps/nrf_cloud_location/prj.conf.

# Sample
CONFIG_NRF_CLOUD_COAP_CELL_LOCATION_SAMPLE_LOG_LEVEL_INF=y



# nRF Cloud CoAP
CONFIG_NRF_CLOUD=y
CONFIG_MODEM_JWT=y
CONFIG_POSIX_API=y
CONFIG_NRF_CLOUD_CHECK_CREDENTIALS=y
CONFIG_NRF_CLOUD_COAP=y
CONFIG_NRF_CLOUD_COAP_DOWNLOADS=n

# AT Host
CONFIG_AT_HOST_LIBRARY=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_AT_MONITOR_HEAP_SIZE=4096
CONFIG_AT_HOST_STACK_SIZE=2048

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

# Enable LTE Connectivity using Connection Manager
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_NRF_MODEM_LIB_NET_IF=y
CONFIG_NRF_MODEM_LIB_NET_IF_AUTO_DOWN=y
CONFIG_NRF_MODEM_LIB_NET_IF_DOWN_DEFAULT_LTE_DISCONNECT=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=1024
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024

# LTE Link Control
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PSM_MODULE=y

# Location library
CONFIG_LOCATION=y
CONFIG_LOCATION_SERVICE_EXTERNAL=y
CONFIG_LOCATION_METHOD_GNSS=n
CONFIG_LOCATION_METHOD_CELLULAR=y

# System
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_ASSERT=y
CONFIG_REBOOT=y
CONFIG_FPU=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_EVENTS=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# LTE Link Control
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PSM_MODULE=y

# CoAP Client
CONFIG_COAP_CLIENT_BLOCK_SIZE=1024
CONFIG_COAP_CLIENT_STACK_SIZE=6144
CONFIG_COAP_CLIENT_THREAD_PRIORITY=0

# Modem key management
#
# Credentials live in sec tag 16842753 and are installed over the AT host by
# nrfcloud_utils.device_credentials_installer --coap. The --coap flag matters: CoAP uses a
# different root CA than MQTT/HTTPS, so MQTT credentials in this sec tag do not work here.
CONFIG_MODEM_KEY_MGMT=y
CONFIG_NRF_CLOUD_SEC_TAG=16842753

# Device ID
#
# The sample defaults to CONFIG_NRF_CLOUD_CLIENT_ID_SRC_INTERNAL_UUID, which upstream chose
# "for compatibility with auto-onboarding". Auto-onboarding is the nRF Cloud Provisioning
# Service, which is nRF91x1-only and cannot work on the 9160 -- this board onboards with
# preconnect onboarding instead, so that default buys it nothing.
#
# This value must match the CN of the installed device certificate exactly, i.e. the
# installer must be run with `--id-str "nrf-" --id-imei`. A mismatch here is silent until
# nrf_cloud_coap_connect() fails to authenticate.
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_IMEI=y
CONFIG_NRF_CLOUD_CLIENT_ID_PREFIX="nrf-"

# TF-M Protected Storage
#
# Must be off. With PS enabled, Partition Manager allocates a 0x4000 tfm_ps partition and
# places it at 0xf0000 -- exactly where this device's SoftSIM filesystem lives -- which
# pushes nvs_storage down to 0xe8000. The app then mounts an empty NVS and reports
# "Failed to init FS", which reads like SoftSIM corruption but is only a moved partition.
# Disabling PS lets pm_static.yml's EMPTY_tfm_ps placeholder hold that space instead, and
# shrinks TF-M. Same setting as apps/softsim/prj.conf:48.
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=n
