# MCUboot is required: the Feather has no debug probe, so the only way to load
# this is serial DFU into the bootloader's app slot.
#
# The upstream sample's boards/*.overlay files were deliberately not copied --
# they pull in nrf91_no_bootloader_partitions.dtsi, which is the opposite of
# what DFU needs. The Feather's own board DTS already has an MCUboot layout.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
