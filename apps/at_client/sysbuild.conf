# Partition Manager is deprecated and no longer enabled by default from NCS 3.4, and this
# app's Kconfig.sysbuild (copied from the upstream sample) additionally sets
# `config PARTITION_MANAGER default n`. Without PM the /ns build signs the image with
# `--rom-fixed 0x50000` (the slot0_ns DTS address) while MCUboot boots slot0 at 0x10000.
# boot_rom_address_check() rejects the mismatch and parks in fih_panic_loop: no console
# output at all, which reads as dead hardware. An explicit assignment here overrides the
# Kconfig default, so the sample's Kconfig.sysbuild can stay as it is.
SB_CONFIG_PARTITION_MANAGER=y

# MCUboot is required: the Feather has no debug probe, so the only way to load
# this is serial DFU into the bootloader's app slot.
#
# The upstream sample's boards/*.overlay files were deliberately not copied --
# they pull in nrf91_no_bootloader_partitions.dtsi, which is the opposite of
# what DFU needs. The Feather's own board DTS already has an MCUboot layout.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
