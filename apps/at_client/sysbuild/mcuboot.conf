# Kconfig fragment applied to the MCUboot image only (sysbuild picks up
# <app>/sysbuild/<image>.conf automatically). Same fix as the other apps here.
#
# Partition Manager defaults CONFIG_PM_PARTITION_SIZE_MCUBOOT to 0xc000 (48 KB), which
# this MCUboot overflows -- ECDSA-P256 plus the CC310 crypto libs put it near 49.6 KB.
# Growing it to 0x10000 costs nothing: mcuboot_pad must start 32 KB aligned at 0x10000,
# so PM was already inserting a dead EMPTY_0 filler over 0xc000-0x10000.
CONFIG_PM_PARTITION_SIZE_MCUBOOT=0x10000
