# Applied AFTER the module's overlay-softsim.conf, which sets
# CONFIG_PM_PARTITION_SIZE_TFM=0x18000 and would otherwise win over prj.conf.
#
# The upstream sample has no bootloader. We add MCUboot (sysbuild.conf) because the
# Feather has no onboard debugger, so the one SWD flash should also leave a
# bootloader behind for later serial DFU updates.
#
# MCUboot inserts a 0x200 mcuboot_pad ahead of the image, which shifts everything
# after it. TF-M must give back exactly that much or the non-secure start address
# stops being 32 KB aligned, and the nRF9160 SPU requires that alignment:
#
#   mcuboot      0x00000 - 0x10000   (64 KB)
#   mcuboot_pad  0x10000 - 0x10200   (512 B)
#   TF-M         0x10200 - 0x28000   (0x17E00 = 0x18000 - 0x200)
#   non-secure   0x28000             <- 32 KB aligned, SPU is happy
#
# Getting this wrong fails loudly at compile time in
# nrf/modules/trusted-firmware-m/tfm_boards/common/assert.c, not silently at runtime.
CONFIG_PM_PARTITION_SIZE_TFM=0x17E00
