# Kconfig fragment applied to the MCUboot image only (sysbuild picks up
# <app>/sysbuild/<image>.conf automatically).
#
# Partition Manager defaults CONFIG_PM_PARTITION_SIZE_MCUBOOT to 0xc000 (48 KB).
# This MCUboot is ~49.6 KB -- ECDSA-P256 signatures plus the CC310 crypto libs --
# so the link fails with "region `FLASH' overflowed by 1588 bytes".
#
# Growing it to 0x10000 costs nothing: mcuboot_pad must start 32 KB aligned at
# 0x10000, so PM was already inserting a dead EMPTY_0 filler over 0xc000-0x10000.
# This just claims that gap. Everything after it keeps the same address:
#
#   mcuboot      0x00000 - 0x10000   (was 0xc000 + 0x4000 of EMPTY_0)
#   mcuboot_pad  0x10000 - 0x10200
#   TF-M         0x10200 - 0x28000   (see ../overlay-mcuboot.conf)
#   app          0x28000 - 0x80000
CONFIG_PM_PARTITION_SIZE_MCUBOOT=0x10000
