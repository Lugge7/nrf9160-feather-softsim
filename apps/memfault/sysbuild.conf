# Partition Manager is deprecated and no longer enabled by default from NCS 3.4. SoftSIM
# needs it (pm_static.yml layouts and NVS placement), so opt in. Without PM the /ns build
# signs with `--rom-fixed 0x50000` while MCUboot boots slot0 at 0x10000, and the image is
# rejected into fih_panic_loop with no console output at all.
SB_CONFIG_PARTITION_MANAGER=y

# SB_CONFIG_SOFTSIM_BUNDLE_TEMPLATE_HEX is deliberately left OFF: with it on, merged.hex
# carries a *blank* SIM template at 0xF0000 and any SWD flash of it wipes the live
# provisioning. This app assumes a SoftSIM that is already up.

# Upstream's prj.conf sets the NCS 2.x CONFIG_BOOTLOADER_MCUBOOT, which sysbuild silently
# ignores. This is the form that actually selects MCUboot, and Memfault FOTA needs it for
# the secondary slot.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
