# project specific configuration settings

# Note: See the overlays directory for additional Kconfig variables settings as not all variables can be
# set in a single prj.conf for backward compatibility with older versions of the nRF Connect SDK /
# Zephyr

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_NATIVE=n

CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MODEM_KEY_MGMT=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_MODEM_INFO=y
CONFIG_AT_SHELL=y
# Note: CONFIG_AT_SHELL_CMD_MODE is set in overlays/ncs-v3.3.0.conf for NCS >= 3.3.0

CONFIG_SHELL=y
CONFIG_SHELL_LOG_BACKEND=n

# Make it possible to send AT commands ending with a "?"
#  https://developer.nordicsemi.com/nRF_Connect_SDK/doc/2.4.2/nrf/libraries/modem/at_shell.html
CONFIG_SHELL_WILDCARD=y

CONFIG_NET_LOG=y

CONFIG_NET_SOCKETS_OFFLOAD=y

CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_NCS_DEVICE_ID_RUNTIME=y

# Note: Can optionally be changed to =y to implement
# a custom event handler for FOTA events
# CONFIG_MEMFAULT_FOTA_DOWNLOAD_CALLBACK_CUSTOM=n

# Enable to demo custom reboot reason capture
CONFIG_MEMFAULT_REBOOT_REASON_CUSTOM_ENABLE=y

# Required for logging backends to work as expected
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y

# Enable capture of recent logs as part of a coredump
CONFIG_MEMFAULT_LOGGING_ENABLE=y

# Disable logging of printk, to improve 'mflt export' performance under deferred
# logging mode.
CONFIG_LOG_PRINTK=n

# Enable Bootloader so OTA updates can be performed
CONFIG_MCUBOOT_IMG_MANAGER=y

# The subsystems we need so OTA payloads can be written to
# flash and updated by MCUBoot
CONFIG_DFU_TARGET=y
CONFIG_DFU_TARGET_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# For Memfault FOTA, we will use the FOTA_DOWNLOAD API's
# from the nRF Connect SDK which depends on the DOWNLOAD_CLIENT
CONFIG_FOTA_DOWNLOAD=y

# To enable Modem FOTA via Memfault, turn on below settings
# CONFIG_MEMFAULT_FOTA_MODEM_UPDATE=y
# CONFIG_MEMFAULT_FOTA_MODEM_PROJECT_KEY="fill_in_modem_fota_project_key"

# Enable printing of file download progress to console
CONFIG_FOTA_DOWNLOAD_PROGRESS_EVT=y

CONFIG_WATCHDOG=y

# Enable Zephyr runtime asserts
CONFIG_ASSERT=y


# Enable Nordic datetime library, which will get network time from the modem
CONFIG_DATE_TIME=y

# ---------------------------------------------------------------------------
# Feather / SoftSIM deltas. Everything above is upstream's prj.conf verbatim,
# except for four removals noted here.
# ---------------------------------------------------------------------------

# 1. CONFIG_BOOTLOADER_MCUBOOT removed. That is the NCS 2.x form and sysbuild
#    silently ignores it, yielding an unsigned image the bootloader rejects.
#    SB_CONFIG_BOOTLOADER_MCUBOOT lives in sysbuild.conf instead.
#
# 2. The littlefs demo (CONFIG_FILE_SYSTEM/_LITTLEFS/_SHELL) removed. It exists
#    only to feed a filesystem-utilization metric, and it wants a storage
#    partition on internal flash -- which on this board is the SoftSIM's
#    nvs_storage at 0xF0000. Not worth the collision for one metric.

# Transport: Memfault's own HTTPS, not the nRF Cloud CoAP session.
#
# The demo can tunnel chunks through nRF Cloud CoAP. That works on this board now
# (see apps/nrf_cloud_coap_location), but it couples Memfault to an onboarding
# that has nothing to do with it, and HTTPS needs only the project key -- no
# certificates, no onboarding, no claiming. Keep the two independent.
CONFIG_MEMFAULT_USE_NRF_CLOUD_COAP=n
CONFIG_MEMFAULT_HTTP_ENABLE=y

# TF-M Protected Storage must be off. With PS enabled, Partition Manager places a
# tfm_ps partition at 0xf0000 -- exactly where the SoftSIM filesystem lives -- and
# pushes nvs_storage down to 0xe8000. The app then mounts an empty NVS and reports
# "Failed to init FS", which reads like SoftSIM corruption but is only a moved
# partition. Same setting as apps/softsim and apps/nrf_cloud_coap_location.
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=n

# Device identity is the IMEI, set at runtime by src/main.c (prv_init_device_info()
# reads it with AT+CGSN and calls memfault_ncs_device_id_set()). That is what
# CONFIG_MEMFAULT_NCS_DEVICE_ID_RUNTIME above enables, so do NOT also set
# CONFIG_MEMFAULT_NCS_DEVICE_ID_IMEI -- they are the same Kconfig choice.
# It matches the IMEI identity already used elsewhere on this device.

# CONFIG_MEMFAULT_NCS_PROJECT_KEY is deliberately absent: it is an ingestion
# credential and lives in the gitignored profiles/memfault_key.conf, which
# CMakeLists.txt appends to OVERLAY_CONFIG.

# Make the demo's own output visible.
#
# Out of the box on this board, `mflt get_device_info`, `mflt post_chunks` and `mflt
# get_core` print absolutely nothing and look broken while working perfectly -- the
# first uploads here could only be confirmed server-side. Two things have to be true
# to see them, and fixing either alone is not enough:
#
#   1. The SoftSIM overlay drops CONFIG_LOG_DEFAULT_LEVEL to 1 (errors only) to keep
#      the console quiet, and CONFIG_MEMFAULT_LOG_LEVEL follows it, so every
#      MEMFAULT_LOG_INFO is filtered out before it is ever emitted.
#   2. What survives goes through Zephyr's deferred LOG subsystem to the UART backend,
#      while the Memfault shell owns that same UART (CONFIG_SHELL_LOG_BACKEND=n), so
#      the output does not reach the prompt. Routing Memfault's logs to printk makes
#      them go straight out.
#
# `mflt test heartbeat` was the misleading clue: it prints via shell_print and always
# worked, which made the silent commands look like real failures rather than a
# logging path.
CONFIG_MEMFAULT_LOG_LEVEL_INF=y
CONFIG_MEMFAULT_PLATFORM_LOG_FALLBACK_TO_PRINTK=y
