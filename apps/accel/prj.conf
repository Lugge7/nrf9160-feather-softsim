# LIS2DH accelerometer on i2c1. The board DTS already declares the node
# (lis2dh: lis2dh@18, compatible "st,lis2dh" in
# zephyr/boards/circuitdojo/feather/circuitdojo_feather_nrf9160_common.dtsi:139), so no
# overlay is needed -- only the driver.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LIS2DH=y

# Console on uart0, the Feather's CP2102N USB-UART (COM15 @ 115200).
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# printf("%f") for the tilt angles.
CONFIG_FPU=y
CONFIG_PICOLIBC_IO_FLOAT=y

# TF-M Protected Storage off, and see pm_static.yml.
#
# This app has no modem and no SoftSIM, but it must still not land on the SoftSIM's flash.
# Without a static layout Partition Manager puts TF-M storage at tfm_otp_nv_counters
# 0xf0000 and tfm_ps 0xf8000 -- exactly over the SoftSIM's nvs_storage and tfm_its -- and
# merely booting the app then destroys the provisioned SIM, with no flash write from the
# host to blame. That is what apps/blinky was doing until it was fixed.
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=n

# Logging, so a fault prints its reason and not just a bare register dump. Without
# CONFIG_LOG the `<err> os: ***** ... FAULT *****` line never appears and all you get is
# the printk register dump, which does not say what kind of fault it was.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Give up TF-M's secure console so the app can reach I2C1.
#
# On the nRF9160, SPIM1/SPIS1/TWIM1/TWIS1/UARTE1 all share one peripheral ID -- Nordic
# calls it a "Serial-Box" -- and the SPU can only assign security per ID, not per
# peripheral. TF-M defaults to CONFIG_TFM_SECURE_UART1=y for its own boot logging, and
# therefore deliberately leaves Serial-Box 1 secure:
#
#   nrf/../tf-m/platform/ext/target/nordic_nrf/common/core/target_cfg_53_91.c:357
#     #if !(defined(SECURE_UART1) && NRF_SECURE_UART_INSTANCE == 1)
#             /* UART1 is a secure peripheral, so we need to leave Serial-Box 1 as Secure */
#             NRF_SPIM1_S_BASE,
#     #endif
#
# The Feather's accelerometer is on i2c1 = TWIM1 = that same box, so any non-secure access
# takes a bus fault at 0x40009000 -- "Precise data bus error", with no hint that a UART is
# to blame. Turning TF-M's secure UART off puts Serial-Box 1 back in the non-secure list.
# We lose TF-M's own boot messages, which this app does not need; the app console is uart0
# and is unaffected.
CONFIG_TFM_SECURE_UART=n
# TF-M still links uart_stdout.c for its own logging, which then fails with
# "undefined reference to Driver_USART1" once the secure UART driver is gone, so its
# logging has to be silenced as well.
CONFIG_TFM_LOG_LEVEL_SILENCE=y
