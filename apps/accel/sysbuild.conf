# Partition Manager is deprecated and no longer enabled by default from NCS 3.4, but it is
# required here so pm_static.yml can pin TF-M storage clear of the SoftSIM. See prj.conf.
SB_CONFIG_PARTITION_MANAGER=y

# NCS 3.x selects MCUboot through sysbuild; the NCS 2.x CONFIG_BOOTLOADER_MCUBOOT form is
# silently ignored and yields an unsigned image the bootloader rejects.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
