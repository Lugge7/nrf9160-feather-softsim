# Partition Manager is deprecated and no longer enabled by default from NCS 3.4.
# SoftSIM still relies on it (pm_static.yml layouts, NVS storage placement, and
# the bundled template.hex address in ../../sysbuild/CMakeLists.txt), so opt in.
SB_CONFIG_PARTITION_MANAGER=y

SB_CONFIG_SOFTSIM_BUNDLE_TEMPLATE_HEX=y

# MCUboot is not in the upstream sample, but the Feather has no onboard debugger.
# Building it in means the single SWD flash of merged.hex (which is the only way to
# place template.hex at the nvs_storage address) also installs a bootloader, so every
# later app update goes over serial DFU with flash.ps1 instead of needing the J-Link.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
