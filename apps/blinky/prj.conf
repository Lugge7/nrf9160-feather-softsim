CONFIG_GPIO=y

# Console on uart0, which is the Feather's CP2102N USB-UART (COM15 @ 115200).
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# TF-M Protected Storage off, and see pm_static.yml.
#
# blinky has no SoftSIM, but it must still not land on the SoftSIM's flash. Without a
# static layout Partition Manager put this app's TF-M storage at:
#
#   tfm_its              0xe8000 - 0xea000
#   tfm_otp_nv_counters  0xf0000 - 0xf2000   <- on top of the SoftSIM filesystem
#   tfm_ps               0xf8000 - 0xfc000   <- on top of the SoftSIM apps' tfm_its
#
# nvs_storage on the SoftSIM apps is 0xf0000-0xf8000 and their tfm_its is 0xf8000, so
# simply *booting* blinky made TF-M write NV counters over the provisioned SIM and its
# PSA keys. Nothing is flashed there -- blinky's image ends at 0x2DB27 -- so it looks
# like the SIM died on its own; the tell is C0DE8112 appearing at 0xf0000.
# Cost two re-provisions on 2026-09-11 before it was tracked down.
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=n
