# Partition Manager is deprecated and no longer enabled by default from NCS 3.4.
# Without it the /ns build signs the image with `--rom-fixed 0x50000` (the
# slot0_ns DTS address) while MCUboot still boots slot0 at 0x10000. MCUboot's
# boot_rom_address_check() sees the mismatch and lands in fih_panic_loop, so the
# app never starts and the console stays silent. Opt in, as the other apps do.
SB_CONFIG_PARTITION_MANAGER=y

# NCS 3.x builds MCUboot through sysbuild, not CONFIG_BOOTLOADER_MCUBOOT in
# prj.conf (that form is NCS 2.x and is what the Circuit Dojo docs still show).
# This is what produces the signed image the Feather's bootloader will accept.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
